# The daily check reports any entry whose board does not respond so it can be fixed or removed.
# Employers with offices in Ireland (or that hire remotely across Europe) and the public job board
# each one uses. `tools/check_companies.py` tests every entry and records which boards respond, how
# many jobs they list in Ireland, and whether the company's own website links to the board. Entries
# that stop working are reported, not silently dropped.
#
# To add a company: find its careers page, open any job, and look at the address of the application
# page. boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>,
# apply.workable.com/<token> and jobs.smartrecruiters.com/<token> give the ATS and token.

